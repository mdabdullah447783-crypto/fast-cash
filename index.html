<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BD Earning</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  padding: 20px;
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
}
.header {
  font-size: 23px;
  font-weight: bold;
  margin: 15px 0 25px;
}
.balance {
  background: linear-gradient(135deg,#087e69,#13b88b);
  padding: 25px;
  border-radius: 18px;
  margin-bottom: 25px;
}
.balance p {
  margin: 0 0 12px;
}
.amount {
  font-size: 32px;
  font-weight: bold;
}
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.item {
  background: #1d293b;
  padding: 23px 10px;
  border-radius: 15px;
  text-align: center;
  font-size: 16px;
}
.item span {
  display: block;
  font-size: 27px;
  margin-bottom: 10px;
}
</style>
</head>
<body>

<div class="header">BD Earning 🚀</div>

<div class="balance">
  <p>আমার ব্যালেন্স</p>
  <div class="amount">৳ 0.00</div>
  <p>বাংলাদেশি টাকা (BDT)</p>
</div>

<div class="grid">
  <div class="item"><span>🏠</span>Home</div>
  <div class="item"><span>👤</span>Dashboard</div>
  <div class="item"><span>💰</span>Balance</div>
  <div class="item"><span>📺</span>Watch Ads</div>
  <div class="item"><span>📋</span>Task</div>
  <div class="item"><span>➕</span>Recharge</div>
  <div class="item"><span>💸</span>Withdraw</div>
  <div class="item"><span>👥</span>Referral</div>
  <div class="item"><span>📜</span>History</div>
  <div class="item"><span>⚙️</span>Settings</div>
</div>

</body>
</html>
